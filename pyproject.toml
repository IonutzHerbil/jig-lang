[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-lang"
version = "0.1.0"
description = "Jig: a Python-shaped language built for LLMs to write and compilers to verify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools]
packages = ["jig"]

[tool.setuptools.package-data]
jig = ["cards/*.md"]
