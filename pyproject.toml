[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-lang"
version = "0.2.0"
description = "Jig: Python plus guarantees, for code that AI writes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
xai = ["scikit-learn>=1.5", "shap>=0.46", "lime>=0.2"]

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools]
packages = ["jig"]

[tool.setuptools.package-data]
jig = ["cards/*.md"]
