[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-lang"
version = "0.3.0"
description = "Jig: Python plus guarantees, for code that AI writes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/IonutzHerbil/jig-lang"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools]
packages = ["jig"]

[tool.setuptools.package-data]
jig = ["cards/*.md", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-p no:cacheprovider"
